# CodeDeploy 배포 명세서(설계도, 지침서) - GitHub Action의 workflow파일과 같은역할
version: 0.0
os: linux

# S3 번들 파일이 EC2 인스턴스에 복사될 위치 지정
files:
  - source: / # 압축 파일 내부의 전체 내용물을 대상으로 함.
    destination: /home/ec2-user/app # EC2 인스턴스의 소스파일 저장 위치(디렉토리 자동 생성)
    
# 복사된 파일/폴더 권한 설정
permissions:
  - object: /home/ec2-user/app/scripts #소유권 변경 대상 지정(.sh파일에 실행 권한이 부여되어있어야 함)
    pattern: "**" # object 하위 디렉토리 모두를 권한 설정 대상으로 함(-R), *는 scripts안에 있는 것만 대상
    owner: ec2-user
    group: ec2-user
    mode: 755

# CodeDeploy 배포 라이프사이클
hooks:
  ApplicationStart:
    - location: scripts/deploy.sh # files.destination의 하위 경로, 실행할 스크립트 정의
      timeout: 300  # 스크립트 실행 결과를 기다리는 최대 허용 시간(초) 
      runas: root   # 스크립트를 실행할 OS의 사용자 계정 권한(즉, root 권한으로 실행하겠다는 의미)